[project]
name = "agentic-cogwriter"
version = "0.1.0"
description = "Materialize prompts and run Agentic CogWriter experiments"
requires-python = ">=3.11"
dependencies = ["pydantic-ai-slim[openai]==2.38.0"]

[project.scripts]
agentic-cogwriter-materialize = "agentic_cogwriter.prompts.materialize:main"
agentic-cogwriter-recompute-dolomites-split = "agentic_cogwriter.prompts.recompute_dolomites_split:main"
agentic-cogwriter-runner = "agentic_cogwriter.runner.cli:main"
agentic-cogwriter-score = "agentic_cogwriter.judges.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agentic_cogwriter"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
