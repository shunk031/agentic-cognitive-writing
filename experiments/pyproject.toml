[project]
name = "agentic-cogwriter"
version = "0.1.0"
description = "Materialize pinned primary benchmark prompt manifests"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentic-cogwriter-materialize = "agentic_cogwriter.prompts.materialize:main"
agentic-cogwriter-recompute-dolomites-split = "agentic_cogwriter.prompts.recompute_dolomites_split:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agentic_cogwriter"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
