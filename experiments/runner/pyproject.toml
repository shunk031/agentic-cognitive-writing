[project]
name = "agentic-cogwriter-runner"
version = "0.1.0"
description = "Run reproducible writing-condition experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentic-cogwriter-runner = "agentic_cogwriter.runner.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agentic_cogwriter.runner"
