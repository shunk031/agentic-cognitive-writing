condition_id = "A3"
title = "Adaptive Task Planning"
skill = "writing-adaptive-task-planning"
analysis_family = "confirmatory"
product_requires_draft = true
# The coordinator writes the task graph, so it is not a history-only Monitor.
monitor_writes_history_only = false
# Each spawn message names only the agent's skill and its task; the agent reads
# the task's fields from the graph, so the coordinator cannot steer its verdict.
spawn_message = 'Read the skill file at plugin/skills/(?:task-node|task-execution)/SKILL\.md and follow it for task [A-Za-z0-9_.-]+'

[package]
name = "cognitive-writing-baselines"

[plugins]
# No codex_adapter: its agent types and spawn instruction are the A4 roles.
# The A3 coordinator spawns default agents that read their own skill files.
paths = ["experiments/baselines"]

[adapters]
codex = "codex_exec"
claude_code = "claude_print"

[invocation]
codex = """Read the skill file at {codex_plugin_root}/skills/writing-adaptive-task-planning/SKILL.md and follow it."""

claude_code = """/cognitive-writing-baselines:writing-adaptive-task-planning"""

[install]
claude_code = ["/plugin marketplace add .", "/plugin install cognitive-writing-baselines@agentic-cognitive-writing-process"]

[trace]
# The fidelity gate reads the node and execution agents from the harness
# records instead of a plugin trace.
required = false
retrieval = "N/A"
evidence = "N/A"
citation = "N/A"
goal_events = "forbidden"
require_delegation = true
event_types = ["process_switch"]
min_events = 1
processes = ["task-node", "task-execution", "task-revision"]

# The gate checks each spawn against the graph: the task is in it under a skill
# of its type, the root goal is the task text, and each node agent's reported
# children are recorded as reported.
[task_graph]
path = ".writing/baselines/adaptive-task-planning/task-graph.json"
root_goal = ".writing/task.md"
skills = { composition = "task-node", reasoning = "task-execution" }

[[stages]]
id = "task-node"

[[stages]]
id = "task-execution"

[[stages]]
id = "task-revision"
