condition_id = "A3"
title = "Adaptive Task Planning"
skill = "writing-adaptive-task-planning"
analysis_family = "confirmatory"
product_requires_draft = true
# The coordinator writes the task graph, so it is not a history-only Monitor.
monitor_writes_history_only = false

[package]
name = "cognitive-writing-baselines"

[plugins]
# No codex_adapter: its agent types and spawn instruction are the A4 roles.
# The A3 coordinator spawns default agents that read their own skill files.
paths = ["experiments/baselines"]

[adapters]
codex = "codex_exec"
claude_code = "claude_print"

[invocation]
codex = """Read the skill file at {codex_plugin_root}/skills/writing-adaptive-task-planning/SKILL.md and follow it."""

claude_code = """/cognitive-writing-baselines:writing-adaptive-task-planning"""

[install]
claude_code = ["/plugin marketplace add .", "/plugin install cognitive-writing-baselines@agentic-cognitive-writing-process"]

[trace]
# The fidelity gate reads the decomposition and execution agents from the
# harness records instead of a plugin trace.
required = false
retrieval = "N/A"
evidence = "N/A"
citation = "N/A"
goal_events = "forbidden"
require_delegation = true
event_types = ["process_switch"]
min_events = 1
processes = ["task-decomposition", "task-execution", "task-revision"]

[[stages]]
id = "task-decomposition"

[[stages]]
id = "task-execution"

[[stages]]
id = "task-revision"
