condition_id = "A10"
skill = "writing-self-refine"
analysis_family = "exploratory"
product_requires_draft = true

[package]
name = "cognitive-writing-baselines"

[plugins]
paths = ["experiments/baselines"]

[adapters]
codex = "codex_exec"
claude_code = "claude_print"

[invocation]
codex = """Read the skill file at {codex_plugin_root}/skills/writing-self-refine/SKILL.md and follow it. The final response must contain the complete final text itself, not a summary or a link to a workspace artifact."""

claude_code = """/cognitive-writing-baselines:writing-self-refine"""

[install]
claude_code = ["/plugin marketplace add .", "/plugin install cognitive-writing-baselines@agentic-cognitive-writing-process"]

[trace]
retrieval = "not_applicable"
evidence = "plugin_recorded"
citation = "plugin_recorded"
goal_events = "forbidden"
event_types = ["process_switch"]
min_events = 5
max_events = 5
process_order = ["draft", "feedback", "refine", "feedback", "refine"]
processes = ["draft", "feedback", "refine"]

