condition_id = "B1"
skill = "writing-cogwriter-style"
analysis_family = "exploratory"
product_requires_draft = true

[package]
name = "cognitive-writing-baselines"

[plugins]
paths = ["experiments/baselines"]

[adapters]
codex = "codex_exec"
claude_code = "claude_print"

[invocation]
codex = """Read the skill file at {codex_plugin_root}/skills/writing-cogwriter-style/SKILL.md and follow it. The final response must contain the complete final text itself, not a summary or a link to a workspace artifact.

Single-turn contract:
This is a single-turn task with no interactive user; never ask clarification questions. When the assignment underspecifies audience, purpose, or scope, apply genre-appropriate defaults and record the assumptions. Conditions with a `.writing/` workspace record assumptions in `.writing/assumptions.md`. Do not state assumptions briefly at the top of the deliverable. Conditions without `.writing/` apply assumptions without an extra preamble. Do not change the deliverable's content contract.

Delegation contract:
Native subagent delegation is available in this environment. Delegate every role the skill assigns to a role agent by spawning a Codex subagent as the skill's delegation brief instructs; performing a delegated role as the coordinator is not permitted in this run and fails the run."""

claude_code = """/cognitive-writing-baselines:writing-cogwriter-style

Workspace contract:
Create and update every `.writing/` file under the session working directory, never under the plugin or skill directory. The final response must contain the complete final text itself, not a summary or a link to a workspace artifact.

Single-turn contract:
This is a single-turn task with no interactive user; never ask clarification questions. When the assignment underspecifies audience, purpose, or scope, apply genre-appropriate defaults and record the assumptions. Conditions with a `.writing/` workspace record assumptions in `.writing/assumptions.md`. Do not state assumptions briefly at the top of the deliverable. Conditions without `.writing/` apply assumptions without an extra preamble. Do not change the deliverable's content contract."""

[install]
claude_code = ["/plugin marketplace add .", "/plugin install cognitive-writing-baselines@agentic-cognitive-writing-process"]

[trace]
retrieval = "not_applicable"
evidence = "plugin_recorded"
citation = "plugin_recorded"
goal_events = "forbidden"
require_delegation = true
event_types = ["process_switch"]
min_events = 4
max_events = 4
process_order = ["initial-planning", "immediate-plan-revision", "parallel-segment-generation", "length-review"]
processes = ["initial-planning", "immediate-plan-revision", "parallel-segment-generation", "length-review"]

[[stages]]
id = "plugin_session"
