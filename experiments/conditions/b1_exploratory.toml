condition_id = "B1"
skill = "writing-cogwriter-style"
analysis_family = "exploratory"
product_requires_draft = true

[package]
name = "cognitive-writing-baselines"

[plugins]
paths = ["experiments/baselines"]

[adapters]
codex_primary = "codex_exec"
claude_code_replication = "claude_print"

[invocation]
codex_primary = "Read the skill file at {codex_plugin_root}/skills/writing-cogwriter-style/SKILL.md and follow it. The final response must contain the complete final text itself, not a summary or a link to a workspace artifact."
claude_code_replication = "/cognitive-writing-baselines:writing-cogwriter-style"

[install]
claude_code_replication = ["/plugin marketplace add .", "/plugin install cognitive-writing-baselines@agentic-cognitive-writing-process"]

[trace]
retrieval = "not_applicable"
evidence = "plugin_recorded"
citation = "plugin_recorded"
processes = ["initial-planning", "immediate-plan-revision", "parallel-segment-generation", "length-review"]
