condition_id = "A5"
skill = "cognitive-writing-no-goal-network"
analysis_family = "confirmatory"
product_requires_draft = true

[package]
name = "cognitive-writing-experiments"

[plugins]
paths = ["plugin", "experiments/plugin"]
codex_adapter = "codex"

[adapters]
codex = "codex_exec"
claude_code = "claude_print"

[invocation]
codex = """Read the skill file at {codex_plugin_root}/skills/cognitive-writing-no-goal-network/SKILL.md and follow it."""

claude_code = """/cognitive-writing-experiments:cognitive-writing-no-goal-network"""

[install]
claude_code = ["/plugin marketplace add .", "/plugin install agentic-cognitive-writing@agentic-cognitive-writing-process", "/plugin install cognitive-writing-experiments@agentic-cognitive-writing-process"]

[trace]
# The Monitor writes only .writing/history.md, as in A4; the fidelity gate reads
# process history from the harness records instead of a plugin trace. Forbidden
# goal events make the runner reject any run that creates or changes goals.md.
required = false
retrieval = "not_applicable"
evidence = "plugin_recorded"
citation = "plugin_recorded"
goal_events = "forbidden"
require_delegation = true
event_types = ["process_switch", "goal_created", "goal_developed", "goal_regenerated"]
min_events = 1
processes = ["planning", "generate", "organize", "goal-setting", "translating", "reviewing", "evaluate", "revise"]

[[stages]]
id = "plugin_session"
