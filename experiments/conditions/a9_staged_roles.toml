condition_id = "A9"
skill = "writing-linear"
analysis_family = "exploratory"
product_requires_draft = true

[package]
name = "cognitive-writing-baselines"

[plugins]
paths = ["experiments/baselines"]

[adapters]
codex = "codex_exec"
claude_code = "claude_print"

[invocation]
codex = """Read the skill file at {codex_plugin_root}/skills/writing-linear/SKILL.md and follow it. The final response must contain the complete final text itself, not a summary or a link to a workspace artifact."""

claude_code = """/cognitive-writing-baselines:writing-linear"""

[install]
claude_code = ["/plugin marketplace add .", "/plugin install cognitive-writing-baselines@agentic-cognitive-writing-process"]

[trace]
