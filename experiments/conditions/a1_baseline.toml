condition_id = "A1"
skill = "writing-single-shot"
analysis_family = "confirmatory"
product_requires_draft = false

[package]
name = "cognitive-writing-baselines"

[plugins]
paths = ["experiments/baselines"]

[adapters]
codex = "codex_exec"
claude_code = "claude_print"

[invocation]
codex = "Read the skill file at {codex_plugin_root}/skills/writing-single-shot/SKILL.md and follow it. The final response must contain the complete final text itself, not a summary or a link to a workspace artifact.\n\nSingle-turn contract:\nThis is a single-turn task with no interactive user; never ask clarification questions. When the assignment underspecifies audience, purpose, or scope, apply genre-appropriate defaults and record the assumptions. Conditions with a `.writing/` workspace record assumptions there. Do not state assumptions briefly at the top of the deliverable. Conditions without `.writing/` apply assumptions without an extra preamble. Do not change the deliverable's content contract."
claude_code = "/cognitive-writing-baselines:writing-single-shot\n\nSingle-turn contract:\nThis is a single-turn task with no interactive user; never ask clarification questions. When the assignment underspecifies audience, purpose, or scope, apply genre-appropriate defaults and record the assumptions. Conditions with a `.writing/` workspace record assumptions there. Do not state assumptions briefly at the top of the deliverable. Conditions without `.writing/` apply assumptions without an extra preamble. Do not change the deliverable's content contract."

[install]
claude_code = ["/plugin marketplace add .", "/plugin install cognitive-writing-baselines@agentic-cognitive-writing-process"]

[trace]
retrieval = "not_applicable"
evidence = "plugin_recorded"
citation = "plugin_recorded"
goal_events = "forbidden"
event_types = ["process_switch"]
min_events = 1
max_events = 1
processes = ["generate"]
