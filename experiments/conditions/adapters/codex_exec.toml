platform = "codex"
executable = "codex"
version_args = ["--version"]
first_args = ["exec", "--json", "--sandbox", "workspace-write", "--skip-git-repo-check", "--model", "{model_id}"]
continuation_args = ["exec", "resume", "{session_id}", "--json", "--skip-git-repo-check", "--model", "{model_id}"]
runtime_args = ["--config", "sandbox_workspace_write.network_access=false", "--config", "web_search=\"disabled\"", "--config", "approval_policy=\"never\""]
network_enforcement = "enforced"

[control_status]
maximum_output_tokens = "monitored-only"
temperature = "monitored-only"
top_p_or_equivalent = "monitored-only"
generation_seed = "monitored-only"
stop_rules = "monitored-only"
