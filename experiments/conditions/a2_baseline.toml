evidence = "plugin_recorded"
citation = "plugin_recorded"
goal_events = "forbidden"
event_types = ["process_switch"]
min_events = 3
max_events = 3
process_order = ["pre-write", "write", "re-write"]
processes = ["pre-write", "write", "re-write"]

