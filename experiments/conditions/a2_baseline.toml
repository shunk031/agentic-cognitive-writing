condition_id = "A2"
skill = "writing-linear"
analysis_family = "confirmatory"
product_requires_draft = true
monitor_writes_history_only = false
# The fidelity gate requires one patch write to each stage file, in this order.
stage_files = [
  ".writing/baselines/linear/pre-write.md",
  ".writing/baselines/linear/write.md",
  ".writing/draft.md",
]

[package]
name = "cognitive-writing-baselines"

[plugins]
paths = ["experiments/baselines"]

[adapters]
codex = "codex_exec"
claude_code = "claude_print"

[invocation]
codex = """Read the skill file at {codex_plugin_root}/skills/writing-linear/SKILL.md and follow it."""

claude_code = """/cognitive-writing-baselines:writing-linear"""

[install]
claude_code = ["/plugin marketplace add .", "/plugin install cognitive-writing-baselines@agentic-cognitive-writing-process"]

[trace]
# The fidelity gate reads the run from the harness records instead of a
# plugin trace.
required = false
retrieval = "not_applicable"
evidence = "plugin_recorded"
citation = "plugin_recorded"
goal_events = "forbidden"
event_types = ["process_switch"]
processes = ["pre-write", "write", "re-write"]

