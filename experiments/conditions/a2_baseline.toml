condition_id = "A2"
skill = "writing-linear"
analysis_family = "confirmatory"
product_requires_draft = false

[package]
name = "cognitive-writing-baselines"

[plugins]
paths = ["experiments/baselines"]

[adapters]
codex_primary = "codex_exec"
claude_code_replication = "claude_print"

[invocation]
codex_primary = "Read the skill file at {codex_plugin_root}/skills/writing-linear/SKILL.md and follow it. The final response must contain the complete final text itself, not a summary or a link to a workspace artifact."
claude_code_replication = "/cognitive-writing-baselines:writing-linear"

[install]
claude_code_replication = ["/plugin marketplace add .", "/plugin install cognitive-writing-baselines@agentic-cognitive-writing-process"]

[trace]
retrieval = "not_applicable"
evidence = "plugin_recorded"
citation = "plugin_recorded"
processes = ["pre-write", "write", "re-write"]
