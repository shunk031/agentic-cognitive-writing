[tool.uv.workspace]
members = ["experiments/prompts", "experiments/runner"]

[dependency-groups]
dev = [
  "mypy>=2.3.1",
  "pre-commit>=4.6.2",
  "pytest>=8.3,<9",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.4",
  "ty>=0.0.75",
  "vulture>=2.16",
]

[tool.pytest.ini_options]
testpaths = ["experiments/prompts/tests"]
pythonpath = ["experiments/prompts/src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["experiments/prompts/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
