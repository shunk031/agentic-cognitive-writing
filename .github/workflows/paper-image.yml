name: Paper TeX image (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build; defaults to the dispatching ref
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-paper-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dispatched ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine short commit SHA
        id: image
        shell: bash
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push TeX image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: paper/tools
          file: paper/tools/Dockerfile
          push: true
          tags: |
            ghcr.io/shunk031/agentic-cognitive-writing/texlive:small-inconsolata-epigraph-nextpage
            ghcr.io/shunk031/agentic-cognitive-writing/texlive:${{ steps.image.outputs.short_sha }}
