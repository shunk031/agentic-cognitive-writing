name: Exact Paper PDF Temp

on:
  push:
    branches:
      - paper-manuscript

permissions:
  contents: read

jobs:
  build-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build paper with repository script
        run: ./paper/tools/build-pdf.sh
      - name: Upload exact PDF
        uses: actions/upload-artifact@v4
        with:
          name: exact-paper-pdf
          path: paper/build/acl_latex.pdf
          if-no-files-found: error
