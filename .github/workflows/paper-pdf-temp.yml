name: Paper PDF Temporary

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-paper:
    if: github.event.pull_request.number == 77
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record exact HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          expected='${{ github.event.pull_request.head.sha }}'
          test "$actual" = "$expected"
          printf '%s\n' "$actual" | tee paper-head.txt

      - name: Build manuscript with repository script
        working-directory: paper
        run: ./tools/build-pdf.sh

      - name: Check LaTeX diagnostics
        shell: bash
        run: |
          set -euo pipefail
          log=paper/build/acl_latex.log
          test -f "$log"
          overfull=$(grep -Ec '^Overfull \\hbox' "$log" || true)
          undef_ref=$(grep -Eic 'LaTeX Warning: Reference .* undefined on input line' "$log" || true)
          undef_cite=$(grep -Eic 'LaTeX Warning: Citation .* undefined on input line' "$log" || true)
          undef_macro=$(grep -Eic 'Undefined control sequence' "$log" || true)
          printf 'Overfull hbox warnings: %s\n' "$overfull"
          printf 'Undefined references: %s\n' "$undef_ref"
          printf 'Undefined citations: %s\n' "$undef_cite"
          printf 'Undefined macros: %s\n' "$undef_macro"
          test "$overfull" -eq 0
          test "$undef_ref" -eq 0
          test "$undef_cite" -eq 0
          test "$undef_macro" -eq 0

      - name: Render every PDF page
        working-directory: paper
        shell: bash
        run: |
          set -euo pipefail
          pages=$(python -c 'import pathlib,re; data=pathlib.Path("build/acl_latex.pdf").read_bytes(); print(len(re.findall(rb"/Type\s*/Page\b", data)))')
          test "$pages" -gt 0
          ./tools/render-pages.sh $(seq 1 "$pages")

      - name: Upload PDF, logs, and page renders
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paper-pdf-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            paper-head.txt
            paper/build/acl_latex.pdf
            paper/build/latexmk.log
            paper/build/acl_latex.log
            paper/build/render/**/*.png
