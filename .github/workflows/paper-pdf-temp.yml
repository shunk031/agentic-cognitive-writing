name: Temporary paper PDF verification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-paper:
    if: github.event.pull_request.number == 77
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Record exact HEAD
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Build PDF with repository script
        run: |
          set -euo pipefail
          paper/tools/build-pdf.sh

      - name: Validate LaTeX diagnostics
        run: |
          set -euo pipefail
          log=paper/build/acl_latex.log
          test -f "$log"
          test "$(grep -Ec '^Overfull \\hbox' "$log" || true)" -eq 0
          test "$(grep -Eic 'LaTeX Warning: Reference .* undefined on input line' "$log" || true)" -eq 0
          test "$(grep -Eic 'LaTeX Warning: Citation .* undefined on input line' "$log" || true)" -eq 0
          test "$(grep -Eic 'Undefined control sequence' "$log" || true)" -eq 0

      - name: Render every PDF page
        run: |
          set -euo pipefail
          pages=$(python3 - <<'PY'
          import re
          pdf_data = open('paper/build/acl_latex.pdf', 'rb').read()
          counts = [int(x) for x in re.findall(rb'/Type\s*/Pages\b.*?/Count\s+(\d+)', pdf_data, re.S)]
          if counts:
              print(max(counts))
          else:
              log = open('paper/build/acl_latex.log', encoding='utf-8', errors='replace').read()
              matches = re.findall(r'Output written on .* \((\d+) pages?,', log)
              if not matches:
                  raise SystemExit('could not determine page count')
              print(matches[-1])
          PY
          )
          test "$pages" -gt 0
          paper/tools/render-pages.sh $(seq 1 "$pages")

      - name: Stage artifact
        run: |
          set -euo pipefail
          mkdir -p paper-artifact/render
          cp paper/build/acl_latex.pdf paper-artifact/
          cp paper/build/latexmk.log paper-artifact/
          cp paper/build/acl_latex.log paper-artifact/
          git rev-parse HEAD > paper-artifact/paper-head.txt
          find paper/build/render -type f -name 'page-*.png' -exec cp {} paper-artifact/render/ \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf-${{ github.event.pull_request.head.sha }}
          path: paper-artifact
          if-no-files-found: error
