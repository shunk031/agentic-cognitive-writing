name: Temporary paper build

on:
  push:
    branches:
      - paper-manuscript

permissions:
  contents: read

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Build manuscript with repository script
        working-directory: paper
        run: ./tools/build-pdf.sh

      - name: Build and check Markdown manuscript
        working-directory: paper
        run: ./tools/build-markdown.sh

      - name: Check LaTeX diagnostics
        shell: bash
        run: |
          set -euo pipefail
          log=paper/build/acl_latex.log
          test -f "$log"
          overfull=$(grep -Ec '^Overfull \\hbox' "$log" || true)
          undef_ref=$(grep -Eic 'LaTeX Warning: Reference .* undefined on input line' "$log" || true)
          undef_cite=$(grep -Eic 'LaTeX Warning: Citation .* undefined on input line' "$log" || true)
          undef_macro=$(grep -Eic 'Undefined control sequence' "$log" || true)
          printf 'Overfull hbox warnings: %s\n' "$overfull"
          printf 'Undefined references: %s\n' "$undef_ref"
          printf 'Undefined citations: %s\n' "$undef_cite"
          printf 'Undefined macros: %s\n' "$undef_macro"
          test "$overfull" -eq 0
          test "$undef_ref" -eq 0
          test "$undef_cite" -eq 0
          test "$undef_macro" -eq 0

      - name: Render every PDF page
        working-directory: paper
        shell: bash
        run: |
          set -euo pipefail
          pages=$(python3 - build/acl_latex.pdf build/acl_latex.log <<'PY'
          import re
          import sys

          pdf_data = open(sys.argv[1], "rb").read()
          counts = [int(value) for value in re.findall(rb"/Type\s*/Pages\b.*?/Count\s+(\d+)", pdf_data, re.S)]
          if counts:
              print(max(counts))
              raise SystemExit

          log_data = open(sys.argv[2], encoding="utf-8", errors="replace").read()
          matches = re.findall(r"Output written on .* \((\d+) pages?,", log_data)
          if not matches:
              raise SystemExit("could not determine PDF page count")
          print(matches[-1])
          PY
          )
          test "$pages" -gt 0
          ./tools/render-pages.sh $(seq 1 "$pages")

      - name: Upload PDF, logs, Markdown build, page renders, and source figures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paper-pdf-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            paper/build/acl_latex.pdf
            paper/build/latexmk.log
            paper/build/acl_latex.log
            paper/build/acl_latex.md
            paper/build/render/**/*.png
            paper/fig/*.pdf
