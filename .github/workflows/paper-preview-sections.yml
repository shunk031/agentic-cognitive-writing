name: Paper section preview

on:
  push:
    branches:
      - paper-manuscript

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Build PDF and Markdown
        working-directory: paper
        run: ./tools/build-markdown.sh
      - name: Render related work and method
        working-directory: paper
        run: ./tools/render-pages.sh 2 3 4
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: related-method-preview
          path: |
            paper/build/acl_latex.pdf
            paper/build/render/
          if-no-files-found: error
