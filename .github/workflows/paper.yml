name: Paper build (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build; defaults to the dispatching ref
        required: false
        type: string
  push:
    branches:
      - "paper-*"
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"

permissions:
  contents: read
  packages: read

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dispatched ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record exact HEAD
        id: checked_out
        shell: bash
        run: |
          exact_head=$(git rev-parse HEAD)
          echo "Checked out $exact_head"
          echo "sha=$exact_head" >> "$GITHUB_OUTPUT"

      # The scope guard audits per-commit feedback batches on a working branch;
      # squash merges fold the manifest and prose commits together, so main is skipped.
      - name: Enforce declared feedback scope
        if: ${{ !contains(fromJSON('["main", "refs/heads/main"]'), inputs.ref || github.ref) }}
        run: python3 paper/tools/check-feedback-scope.py

      - name: Check main-text appendix references
        run: python3 paper/tools/check-appendix-refs.py

      - name: Check Figure 1 and Appendix role colors
        run: python3 paper/tools/check-role-colors.py

      - name: Enforce one sentence per manuscript source line
        run: python3 paper/tools/check-sentence-lines.py

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ban em-dash source forms
        working-directory: paper
        shell: bash
        run: |
          set -euo pipefail
          # numbers.tex is generated and still contains legacy missing-value
          # commands; acl_latex.tex remaps those commands before rendering.
          if grep -RInE --include='*.tex' --exclude='numbers.tex' --exclude-dir=build '(—|---|\\textemdash|\\emdash)' .; then
            echo '::error::Em-dash source forms are forbidden in manuscript TeX. Use a colon, semicolon, comma, parentheses, or another construction.'
            exit 1
          fi

      - name: Check caption length
        working-directory: paper
        run: python3 tools/check-caption-length.py

      - name: Build manuscript with repository script
        working-directory: paper
        run: ./tools/build-pdf.sh

      - name: Ban rendered em dashes
        working-directory: paper
        shell: bash
        run: |
          set -euo pipefail
          # build-pdf.sh tags the TeX image, which carries poppler-utils.
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/workspace" --workdir /workspace \
            agentic-cognitive-writing/texlive:latest-small-inconsolata-epigraph-nextpage \
            pdftotext -layout build/acl_latex.pdf build/acl_latex.txt
          if grep -n '—' build/acl_latex.txt; then
            echo '::error::Rendered manuscript contains an em dash.'
            exit 1
          fi

      - name: Check rendered caption lines
        working-directory: paper
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/workspace" --workdir /workspace \
            agentic-cognitive-writing/texlive:latest-small-inconsolata-epigraph-nextpage \
            python3 tools/check-caption-lines.py build/acl_latex.pdf

      - name: Build Markdown manuscript
        working-directory: paper
        run: ./tools/build-markdown.sh

      - name: Check LaTeX diagnostics
        shell: bash
        run: |
          set -euo pipefail
          log=paper/build/acl_latex.log
          test -f "$log"
          overfull=$(grep -Ec '^Overfull \\hbox' "$log" || true)
          undef_ref=$(grep -Eic 'LaTeX Warning: Reference .* undefined on input line' "$log" || true)
          undef_cite=$(grep -Eic 'LaTeX Warning: Citation .* undefined on input line' "$log" || true)
          undef_macro=$(grep -Eic 'Undefined control sequence' "$log" || true)
          printf 'Overfull hbox warnings: %s\n' "$overfull"
          printf 'Undefined references: %s\n' "$undef_ref"
          printf 'Undefined citations: %s\n' "$undef_cite"
          printf 'Undefined macros: %s\n' "$undef_macro"
          test "$overfull" -eq 0
          test "$undef_ref" -eq 0
          test "$undef_cite" -eq 0
          test "$undef_macro" -eq 0

      - name: Render every PDF page
        working-directory: paper
        shell: bash
        run: |
          set -euo pipefail
          pages=$(python3 - build/acl_latex.pdf build/acl_latex.log <<'PY'
          import re
          import sys

          pdf_data = open(sys.argv[1], "rb").read()
          counts = [int(value) for value in re.findall(rb"/Type\s*/Pages\b.*?/Count\s+(\d+)", pdf_data, re.S)]
          if counts:
              print(max(counts))
              raise SystemExit

          log_data = open(sys.argv[2], encoding="utf-8", errors="replace").read()
          matches = re.findall(r"Output written on .* \((\d+) pages?,", log_data)
          if not matches:
              raise SystemExit("could not determine PDF page count")
          print(matches[-1])
          PY
          )
          test "$pages" -gt 0
          ./tools/render-pages.sh $(seq 1 "$pages")

      - name: Upload PDF, logs, Markdown build, and page renders
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: paper-pdf-${{ steps.checked_out.outputs.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            paper/build/acl_latex.pdf
            paper/build/latexmk.log
            paper/build/acl_latex.log
            paper/build/acl_latex.md
            paper/build/render/**/*.png
