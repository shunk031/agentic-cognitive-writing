name: ACL pubcheck (temporary)

on:
  push:
    branches:
      - "paper-arr-responsible-checklist"

permissions:
  contents: read
  packages: read

jobs:
  aclpubcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build line-number-free validation copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("paper/acl_latex.tex")
          text = path.read_text()
          old = r"\usepackage[review]{acl}"
          new = r"\usepackage[final]{acl}"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one review-mode ACL package declaration")
          path.write_text(text.replace(old, new, 1))
          PY
          cd paper
          ./tools/build-pdf.sh

      - name: Run ACL pubcheck
        shell: bash
        run: |
          set -o pipefail
          mkdir -p paper/build/aclpubcheck
          uvx --from git+https://github.com/acl-org/aclpubcheck \
            aclpubcheck --paper_type long --disable_bottom_check \
            --output-dir paper/build/aclpubcheck paper/build/acl_latex.pdf \
            2>&1 | tee paper/build/aclpubcheck/aclpubcheck.txt

      - name: Upload ACL pubcheck report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aclpubcheck-report
          if-no-files-found: warn
          retention-days: 1
          path: paper/build/aclpubcheck/
