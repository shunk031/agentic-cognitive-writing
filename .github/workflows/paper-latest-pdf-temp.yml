name: Paper latest PDF

on:
  push:
    branches:
      - paper-manuscript

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Build PDF and Markdown
        working-directory: paper
        run: ./tools/build-markdown.sh
      - name: Render main pages
        working-directory: paper
        run: ./tools/render-pages.sh 1 2 3 4 5 6 7
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: latest-paper-pdf
          path: |
            paper/build/acl_latex.pdf
            paper/build/render/
          if-no-files-found: error
